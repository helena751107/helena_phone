# Static site deploy — no Jekyll, no service worker
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Build static site bundle
        run: |
          set -euo pipefail
          mkdir -p _site
          # Never follow nested repos / secrets
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.secrets.env' \
            --exclude='.env' \
            --exclude='_site/' \
            --exclude='helana_log/' \
            --exclude='browser-env/' \
            --exclude='.aider*' \
            --exclude='**/__pycache__/' \
            --exclude='*.pyc' \
            --exclude='assets/mobile-shot-*.png' \
            --exclude='assets/pw-*.png' \
            ./ _site/
          test -f _site/index.html
          test -f _site/site.webmanifest
          test -f _site/icons/icon-192.png
          test -f _site/icons/icon-512.png
          # prove accordion fix is in the bundle
          grep -q 'accChapters' _site/index.html
          grep -q 'acc-head' _site/index.html
          ! grep -q 'const chapters = \$\$' _site/index.html || (echo 'BAD: old chapters collision still present' && exit 1)
          touch _site/.nojekyll
          python3 -c "import json; json.load(open('_site/site.webmanifest'))"
          echo "Bundle ready:" && du -sh _site && ls _site/icons | head
          # verify no nested .git
          ! find _site -name .git -type d | grep -q . || (echo nested git && exit 1)

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
