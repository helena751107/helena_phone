# Deploy static site to gh-pages branch (avoids stuck workflow deployment lock)
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Build static site bundle
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.secrets.env' \
            --exclude='.env' \
            --exclude='_site/' \
            --exclude='helana_log/' \
            --exclude='browser-env/' \
            --exclude='.aider*' \
            --exclude='**/__pycache__/' \
            --exclude='*.pyc' \
            --exclude='assets/mobile-shot-*.png' \
            --exclude='assets/pw-*.png' \
            ./ _site/
          test -f _site/index.html
          test -f _site/site.webmanifest
          test -f _site/icons/icon-192.png
          grep -q 'accChapters' _site/index.html
          grep -q 'acc-head' _site/index.html
          touch _site/.nojekyll
          python3 -c "import json; json.load(open('_site/site.webmanifest'))"
          echo "Bundle ready:" && du -sh _site

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
          enable_jekyll: false
          cname: ""
