<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="S21 Phone — 갤럭시 폰 하나로 돌아가는 풀스택 워크스테이션" />

  <!-- 언어 토글: 🇰🇷 한글(원본) · 🇬🇧 English(번역) -->
  <script>

    * { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    /* ---- Ambient glow ---- */
    body::before {
      content: ''; position: fixed; top: -40%; left: -20%;
      width: 140%; height: 100%;
      background: radial-gradient(ellipse at 30% 20%, rgba(41,151,255,0.06) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }

    /* ============================================================
       Navigation
       ============================================================ */
    nav {
      position: fixed; top:0; left:0; right:0; z-index:100;
      padding: 0 2rem; height: 52px;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(10,10,15,0.75);
      backdrop-filter: blur(20px) saturate(1.4);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
      border-bottom: 1px solid var(--border);
    }
    nav .logo {
      font-weight: 600; font-size: 0.95rem;
      letter-spacing: -0.02em;
      background: var(--gradient-1);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    nav .links { display:flex; gap:1.5rem; align-items:center; }
    nav .links a {
      color: var(--text-secondary); text-decoration:none; font-size:0.8rem;
      transition: color var(--transition);
      letter-spacing: 0.3px;
    }
    nav .links a:hover { color: var(--text); }

    /* ============================================================
       Containers
       ============================================================ */
    .container { position:relative; z-index:1; max-width:1060px; margin:0 auto; padding:0 2rem; }

    /* ============================================================
       Hero
       ============================================================ */
    .hero {
      padding: 140px 0 80px; text-align:center;
      opacity:0; transform:translateY(20px);
      animation: fadeUp 0.8s ease forwards;
    }
    @keyframes fadeUp { to { opacity:1; transform:translateY(0); } }

    .hero .chip {
      display:inline-block; margin-bottom:1.5rem;
      padding:0.3rem 0.9rem; border-radius:100px;
      font-size:0.75rem; font-weight:500; letter-spacing:0.3px;
      background: rgba(41,151,255,0.1); color: var(--accent);
      border:1px solid rgba(41,151,255,0.2);
    }
    .hero h1 {
      font-size: clamp(2.8rem, 7vw, 4.8rem); font-weight:700;
      letter-spacing: -0.04em; line-height:1.05;
    }
    .hero h1 .gradient {
      background: var(--gradient-1);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .hero p {
      max-width:600px; margin:1.5rem auto 2rem;
      color: var(--text-secondary); font-size:1.15rem; line-height:1.6;
    }

    .hero-stats {
      display:flex; justify-content:center; gap:2.5rem; flex-wrap:wrap;
      margin-top:2rem;
    }
    .hero-stats .stat { text-align:center; }
    .hero-stats .stat .num {
      font-size:1.8rem; font-weight:600; letter-spacing:-0.03em;
      background: var(--gradient-1);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .hero-stats .stat .label { font-size:0.8rem; color:var(--text-tertiary); margin-top:0.1rem; }

    /* ============================================================
       Section title
       ============================================================ */
    .section-title {
      text-align:center; margin-bottom:3rem;
      opacity:0; transform:translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .section-title.visible { opacity:1; transform:translateY(0); }
    .section-title h2 {
      font-size:2rem; font-weight:650; letter-spacing:-0.03em;
    }
    .section-title p {
      color:var(--text-secondary); font-size:0.95rem; margin-top:0.5rem;
    }

    /* ============================================================
       Repo Grid — 5 cards, Mac-like
       ============================================================ */
    .repo-grid {
      display:grid; grid-template-columns:repeat(auto-fit, minmax(300px,1fr)); gap:1.2rem;
      margin-bottom:5rem;
    }
    .repo-card {
      position:relative; display:flex; flex-direction:column;
      padding:1.6rem 1.5rem;
      background: var(--bg-card); border:1px solid var(--border);
      border-radius: var(--radius-lg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background var(--transition), border-color var(--transition), transform 0.3s ease;
      cursor:default;
      opacity:0; transform:translateY(20px);
    }
    .repo-card.visible { opacity:1; transform:translateY(0); transition: opacity 0.5s ease, transform 0.5s ease, background var(--transition), border-color var(--transition); }
    .repo-card:hover {
      background: var(--bg-card-hov); border-color: var(--border-hov);
      transform: translateY(-3px);
    }
    .repo-card .emoji { font-size:2rem; margin-bottom:0.6rem; }
    .repo-card h3 { font-size:1.05rem; font-weight:600; margin-bottom:0.3rem; }
    .repo-card h3 a { color:var(--text); text-decoration:none; }
    .repo-card h3 a:hover { color:var(--accent); }
    .repo-card p { font-size:0.85rem; color:var(--text-secondary); line-height:1.5; flex:1; }
    .repo-card .meta {
      display:flex; gap:0.4rem; flex-wrap:wrap; margin-top:0.8rem;
    }
    .repo-card .tag {
      padding:0.15rem 0.55rem; border-radius:100px;
      font-size:0.7rem; font-weight:500;
      background: rgba(255,255,255,0.06); color: var(--text-tertiary);
    }
    .repo-card .tag-blue  { background:rgba(41,151,255,0.12); color:#2997ff; }
    .repo-card .tag-green { background:rgba(48,219,91,0.12);  color:#30db5b; }
    .repo-card .tag-purple{ background:rgba(125,78,255,0.12); color:#7d4eff; }
    .repo-card .tag-pink  { background:rgba(255,69,110,0.12);  color:#ff456e; }
    .repo-card .tag-amber { background:rgba(255,175,64,0.12); color:#ffaf40; }

    .repo-card .arrow {
      position:absolute; top:1.4rem; right:1.4rem;
      color:var(--text-tertiary); font-size:1.1rem;
      transition: transform 0.3s ease, color 0.3s ease;
    }
    .repo-card:hover .arrow { transform:translate(3px,-3px); color:var(--accent); }

    /* ============================================================
       Ecosystem Table — clean minimal
       ============================================================ */
    .eco-section { margin-bottom:5rem; }
    .eco-table {
      width:100%; border-collapse:separate; border-spacing:0;
      border-radius: var(--radius-md); overflow:hidden;
      border:1px solid var(--border);
      opacity:0; transform:translateY(16px); transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .eco-table.visible { opacity:1; transform:translateY(0); }
    .eco-table thead { background: rgba(255,255,255,0.03); }
    .eco-table th {
      padding:0.8rem 1rem; font-size:0.75rem; font-weight:600;
      color:var(--text-tertiary); text-transform:uppercase; letter-spacing:0.8px;
      text-align:left; border-bottom:1px solid var(--border);
    }
    .eco-table td {
      padding:0.75rem 1rem; font-size:0.85rem; color:var(--text-secondary);
      border-bottom:1px solid rgba(255,255,255,0.04);
    }
    .eco-table tr:last-child td { border-bottom:none; }
    .eco-table a {
      color:var(--accent); text-decoration:none;
      transition: opacity var(--transition);
    }
    .eco-table a:hover { opacity:0.75; }
    .eco-table .status-dot {
      display:inline-block; width:8px; height:8px; border-radius:50%;
      margin-right:0.4rem;
    }
    .eco-table .status-dot.done { background:#30db5b; box-shadow:0 0 8px rgba(48,219,91,0.4); }

    /* ============================================================
       Timeline
       ============================================================ */
    .timeline-wrap {
      position:relative; padding-left:2.5rem; margin-bottom:5rem;
      opacity:0; transform:translateY(16px); transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .timeline-wrap.visible { opacity:1; transform:translateY(0); }
    .timeline-wrap::before {
      content:''; position:absolute; left:0; top:0; bottom:0;
      width:1px; background: linear-gradient(to bottom, var(--border), transparent);
    }
    .tl-item { position:relative; margin-bottom:1.8rem; }
    .tl-item::before {
      content:''; position:absolute; left:-2.5rem; top:0.4rem;
      width:10px; height:10px; border-radius:50%;
      background: var(--accent); border:2px solid var(--bg);
      box-shadow:0 0 0 1px var(--border);
    }
    .tl-item h3 { font-size:1rem; font-weight:500; }
    .tl-item h3 a { color:var(--text); text-decoration:none; }
    .tl-item h3 a:hover { color:var(--accent); }
    .tl-item .date {
      display:inline-block; font-size:0.7rem; color:var(--text-tertiary);
      margin-top:0.15rem; letter-spacing:0.3px;
    }
    .tl-item p { font-size:0.85rem; color:var(--text-secondary); margin-top:0.2rem; }

    /* ============================================================
       Notebook Grid
       ============================================================ */
    .notebook-grid {
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
      gap:0.8rem; margin-bottom:5rem;
    }
    .nb-item {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      text-align:center; padding:1.2rem 0.8rem;
      background: var(--bg-card); border:1px solid var(--border);
      border-radius: var(--radius-md);
      text-decoration:none; color:var(--text-secondary);
      font-size:0.8rem; gap:0.3rem;
      transition: background var(--transition), border-color var(--transition), transform 0.3s ease;
      opacity:0; transform:translateY(12px);
    }
    .nb-item.visible { opacity:1; transform:translateY(0); transition: opacity 0.4s ease, transform 0.4s ease, background var(--transition), border-color var(--transition), transform 0.3s ease; }
    .nb-item:hover {
      background: var(--bg-card-hov); border-color:var(--border-hov);
      transform: translateY(-2px);
    }
    .nb-item .emoji { font-size:1.4rem; }

    /* ============================================================
       Communication cards
       ============================================================ */
    .comm-grid {
      display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr));
      gap:1rem; margin-bottom:5rem;
    }
    .comm-card {
      padding:1.4rem; border-radius:var(--radius-md);
      background: var(--bg-card); border:1px solid var(--border);
      transition: background var(--transition), border-color var(--transition), transform 0.3s ease;
      opacity:0; transform:translateY(14px);
    }
    .comm-card.visible { opacity:1; transform:translateY(0); transition: opacity 0.5s ease, transform 0.5s ease, background var(--transition), border-color var(--transition); }
    .comm-card:hover { background:var(--bg-card-hov); border-color:var(--border-hov); transform:translateY(-2px); }
    .comm-card h3 { font-size:0.95rem; font-weight:600; margin-bottom:0.3rem; }
    .comm-card p { font-size:0.8rem; color:var(--text-secondary); line-height:1.5; }
    .comm-card .status-badge {
      display:inline-block; margin-top:0.6rem;
      padding:0.2rem 0.6rem; border-radius:100px;
      font-size:0.7rem; font-weight:500;
      background:rgba(48,219,91,0.1); color:#30db5b;
    }

    /* ============================================================
       Giscus / Footer
       ============================================================ */
    .giscus-section { margin-bottom:3rem; }
    .giscus {
      min-height:260px;
      opacity:0; transform:translateY(12px); transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .giscus.visible { opacity:1; transform:translateY(0); }

    footer {
      text-align:center; padding:3rem 0 2.5rem;
      border-top:1px solid var(--border);
    }
    footer p { font-size:0.8rem; color:var(--text-tertiary); }
    footer .links { display:flex; justify-content:center; gap:1.5rem; margin-top:0.5rem; }
    footer .links a { color:var(--text-tertiary); text-decoration:none; font-size:0.8rem; transition:color var(--transition); }
    footer .links a:hover { color:var(--accent); }

    /* ============================================================
       Responsive
       ============================================================ */
    @media (max-width:768px) {
      nav .links { display:none; }
      .hero { padding:110px 0 50px; }
      .hero h1 { font-size:2.4rem; }
      .hero-stats { gap:1.5rem; }
      .repo-grid { grid-template-columns:1fr; }
      .notebook-grid { grid-template-columns:repeat(auto-fill, minmax(120px,1fr)); }
      .comm-grid { grid-template-columns:1fr; }
      .eco-table th, .eco-table td { padding:0.5rem; font-size:0.75rem; }
    }
    @media (max-width:480px) {
      .container { padding:0 1rem; }
      .hero h1 { font-size:1.8rem; }
      .section-title h2 { font-size:1.4rem; }
    }
  </style>
</head>

<!-- ============ Scroll Animations ============ -->
<script>
  (function() {
    const els = document.querySelectorAll(
      '.section-title, .repo-card, .comm-card, .nb-item, .timeline-wrap, .eco-table, .giscus'
    );
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry, i) => {
        if (entry.isIntersecting) {
          // Stagger
          const delay = Array.from(entry.target.parentNode?.children || []).indexOf(entry.target) * 40;
          setTimeout(() => entry.target.classList.add('visible'), delay);
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.05, rootMargin: '0px 0px -40px 0px' });

    els.forEach(el => observer.observe(el));
  })();
</script>
