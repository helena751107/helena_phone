# ==============================================================================
# care.conf — 트랙 1 돌봄 데몬 설정
# ==============================================================================
# 위치: ~/care/care.conf (Termux 홈, proot Ubuntu 아님)
# 적용: care-daemon.sh 실행 시 자동 source
# ==============================================================================

# ── 텔레그램 (필수) ──────────────────────────────────────────────────────
# TG_TOKEN="REDACTED:AAH..."   ← .secrets.env와 동일한 봇 토큰 또는 별도 봇
# TG_CHAT_HELENA="REDACTED"    ← 헬레나 (1차 수신)
# TG_CHAT_PASTOR=""              ← 목사님 (2차 에스컬레이션, 선택)

# ── 임계값 ────────────────────────────────────────────────────────────────
BATTERY_LOW=15              # 배터리 잔량(%) — 이하이면 즉시 경고
BATTERY_DROP_PCT=30         # 급감 기준 (%) — 이 이상 떨어지면 알림
BATTERY_DROP_MIN=60         # 급감 감지 시간 (분)
TEMP_HIGH=45                # 배터리 온도 (°C) — 이상이면 과열 경고
GPS_SILENT_HOURS=2          # GPS 무응답 허용 시간 (시간)
NO_MOVE_HOURS=6             # 위치 무변동 허용 시간 (시간)
LOCATION_RADIUS_M=500       # 평소 반경 (m) — 이 밖으로 나가면 선택적 보고

# ── Tailscale (돌봄 터널 백본) ────────────────────────────────────────────
S21_TS_HOST="helena-s21"    # tailscale status에 표시될 S21 호스트명
TAILSCALE_STATE_FILE="/data/data/com.termux/files/home/care/tailscale-state.json"

# ── proot 게이트웨이 ─────────────────────────────────────────────────────
# Termux(bionic)가 Tailscale 받고 proot(glibc)는 localhost 경유
# 구조: PC ←Tailscale→ Termux(SSH:8022) ←localhost→ proot:2222
PROOT_NAME="ubuntu"         # proot-distro 컨테이너명
PROOT_PORT_START=9000       # 포트포워드 기준 포트

# ── 알림 ──────────────────────────────────────────────────────────────────
DISABLE_NOTIFY=false        # true = 무음 알림 (정기 보고에만 권장)
