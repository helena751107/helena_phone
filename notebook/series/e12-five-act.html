<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPISODE 12 — S21 Phone Series</title>
<style>
:root { --bg:#0a0908; --surface:#141312; --text:#e8e6e3; --muted:#8b8680; --gold:#c9a84c; --teal:#2ec4b6; --radius:12px; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; line-height:1.6; }
.nav { position:fixed; top:0; left:0; right:0; z-index:100; background:rgba(10,9,8,0.9); backdrop-filter:blur(10px); padding:0.8rem 2rem; display:flex; justify-content:space-between; border-bottom:1px solid #1a1a1a; }
.nav-logo { font-weight:900; color:var(--gold); }
.hero { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:2rem; }
.hero-chip { background:var(--teal); color:var(--bg); padding:4px 14px; border-radius:20px; font-size:0.8rem; font-weight:700; letter-spacing:0.1em; margin-bottom:1.5rem; }
.hero h1 { font-size:clamp(2rem,6vw,4rem); line-height:1.15; }
.hero h1 span { color:var(--gold); }
.section { max-width:900px; margin:0 auto; padding:4rem 2rem; }
.section h2 { font-size:2rem; margin-bottom:1.5rem; border-left:4px solid var(--gold); padding-left:1rem; }
.flow-step { display:flex; align-items:flex-start; gap:1rem; padding:1rem; cursor:pointer; border-radius:8px; transition:all 0.3s; margin:0.3rem 0; }
.flow-step:hover { background:var(--surface); }
.flow-num { width:36px; height:36px; border-radius:50%; background:var(--surface); display:flex; align-items:center; justify-content:center; font-weight:900; flex-shrink:0; border:2px solid #333; }
.flow-step.active .flow-num { background:var(--teal); border-color:var(--teal); color:var(--bg); }
.flow-body { flex:1; }
.flow-title { font-weight:700; }
.flow-detail { display:none; font-size:0.85rem; color:var(--muted); margin-top:0.5rem; }
.flow-step.active .flow-detail { display:block; }
</style></head><body>
<nav class="nav"><span class="nav-logo">S21 PHONE</span><span>Ch3 · EPISODE 12</span></nav>
<section class="hero"><div class="hero-chip">EPISODE 12</div><h1>연출을 <span>코드</span>로</h1><p style="color:var(--muted);max-width:500px;">5막 연출 성경 (Grok 설계 → DeepSeek 실행) — establish→focus→act→hold→release. VO가 시계를 잡고 화면이 따른다.</p></section>
<section class="section"><h2>5막 구조</h2><div class="flow-step active" data-click-target>
<div class="flow-num">1</div><div class="flow-body"><div class="flow-title">establish 12%</div>
<div class="flow-detail">카메라 도착·chip/caption·빛 ON.</div></div></div><div class="flow-step " data-click-target>
<div class="flow-num">2</div><div class="flow-body"><div class="flow-title">focus 15%</div>
<div class="flow-detail">커서 이동·콜아웃.</div></div></div><div class="flow-step " data-click-target>
<div class="flow-num">3</div><div class="flow-body"><div class="flow-title">act 22%</div>
<div class="flow-detail">demoClick·실클릭·proof.</div></div></div><div class="flow-step " data-click-target>
<div class="flow-num">4</div><div class="flow-body"><div class="flow-title">hold 43%</div>
<div class="flow-detail">결과 유지·나레이션.</div></div></div><div class="flow-step " data-click-target>
<div class="flow-num">5</div><div class="flow-body"><div class="flow-title">release 8%</div>
<div class="flow-detail">clearFocus·다음 준비.</div></div></div></section>
<script>
document.querySelectorAll('.flow-step').forEach(el => {
  el.addEventListener('click', function() { document.querySelectorAll('.flow-step').forEach(s => s.classList.remove('active')); this.classList.add('active'); });
});
</script></body></html>
